[package]
name = "ipprobe"
version = "0.1.0"
edition = "2021"
description = "IPProbe - 自动探测本机 IPv4/IPv6 地址的 Windows 桌面应用(Iced)"
license = "MIT"

[[bin]]
name = "IPProbe"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "auto-detect-theme", "smol"] }
if-addrs = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.24"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
